<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>猫カフェ店舗用 🐈‍⬛ 計算ツール</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #fffaf7;
      color: #4a403d;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    /* =========================
       タイトル
    ========================= */

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      color: #514642;
      letter-spacing: 0.02em;
    }

    /* =========================
       商品セクション
    ========================= */

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;

      margin: 28px 0 12px;
      padding-bottom: 8px;

      font-size: 24px;
      font-weight: 800;
      color: #514642;

      border-bottom: 2px solid #eaded7;
    }

    .section-title .emoji {
      font-size: 25px;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 17px 18px;

      box-shadow:
        0 3px 12px rgba(110, 85, 70, 0.08);

      border: 1px solid #f3eae5;
    }

    .product-name {
      font-size: 18px;
      font-weight: 800;
      color: #514642;
      margin-bottom: 5px;
    }

    .product-price {
      font-size: 14px;
      color: #9a8982;
      margin-bottom: 13px;
    }

    .quantity-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .quantity-button {
      border: none;
      background: #f5e6df;
      color: #66524b;

      min-width: 48px;
      height: 42px;

      border-radius: 12px;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.1s ease,
        background 0.1s ease;
    }

    .quantity-button:hover {
      background: #ead8d0;
    }

    .quantity-button:active {
      transform: scale(0.95);
    }

    .quantity-input {
      width: 82px;
      height: 42px;

      border: 1px solid #e6d8d1;
      border-radius: 12px;

      background: #fffdfc;

      text-align: center;

      font-size: 18px;
      font-weight: 700;
      color: #514642;
    }

    .quantity-input:focus {
      outline: none;
      border-color: #cdb6aa;
      box-shadow: 0 0 0 3px rgba(205, 182, 170, 0.18);
    }

    /* =========================
       注文情報エリア
    ========================= */

    .info-box {
      margin-top: 34px;
      background: #fffdfc;

      border-radius: 22px;
      padding: 20px;

      box-shadow:
        0 4px 16px rgba(110, 85, 70, 0.08);

      border: 1px solid #f0e6e1;
    }

    .info-title {
      display: flex;
      align-items: center;
      gap: 8px;

      margin: 0;
      padding-bottom: 10px;

      font-size: 23px;
      font-weight: 800;
      color: #514642;

      border-bottom: 2px solid #eaded7;
    }

    .info-title .emoji {
      font-size: 24px;
    }

    /* =========================
       注文内容
    ========================= */

    #orderList {
      margin-top: 14px;
    }

    .empty-message {
      padding: 20px 10px;

      text-align: center;

      color: #b3a6a0;
      font-size: 15px;
      line-height: 1.7;
    }

    .order-item {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 11px 13px;
      margin-bottom: 7px;

      background: #fff8f4;
      border-radius: 12px;

      font-size: 15px;
    }

    .order-item-name {
      font-weight: 700;
      color: #5b4c47;
    }

    .order-item-quantity {
      color: #8b756c;
      font-weight: 700;
      white-space: nowrap;
    }

    /* =========================
       合計
    ========================= */

    .total-box {
      margin-top: 18px;
      padding: 16px 18px;

      background: #fdf1eb;
      border-radius: 16px;

      border: 1px solid #f1dfd6;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 5px 0;

      font-size: 16px;
    }

    .total-row + .total-row {
      border-top: 1px dashed #e5d1c8;
      margin-top: 5px;
      padding-top: 10px;
    }

    .total-label {
      font-weight: 700;
      color: #6b5952;
    }

    .total-value {
      font-size: 20px;
      font-weight: 800;
      color: #51423d;
    }

    /* =========================
       必要な材料
    ========================= */

    .material-list {
      margin-top: 14px;
    }

    .material-item {
      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 11px 13px;
      margin-bottom: 7px;

      background: #f9f5f2;
      border-radius: 12px;

      font-size: 15px;
    }

    .material-name {
      font-weight: 700;
      color: #5b4c47;
    }

    .material-quantity {
      font-weight: 800;
      color: #806b62;
    }

    /* =========================
       リセットボタン
    ========================= */

    .reset-button {
      width: 100%;

      margin-top: 22px;
      padding: 15px;

      border: none;
      border-radius: 15px;

      background: #f1dfd7;
      color: #5c4d47;

      font-size: 16px;
      font-weight: 800;

      cursor: pointer;

      transition:
        transform 0.1s ease,
        background 0.1s ease;
    }

    .reset-button:hover {
      background: #ead3ca;
    }

    .reset-button:active {
      transform: scale(0.98);
    }

    /* =========================
       アップデート情報
    ========================= */

    .update-info {
      margin-top: 34px;
      padding: 18px 16px;

      text-align: center;

      color: #9b8b84;
      font-size: 12px;
      line-height: 1.7;

      border-top: 1px solid #eaded7;
    }

    .update-title {
      margin: 0 0 9px;

      font-size: 14px;
      font-weight: 800;

      color: #75645d;
    }

    .update-list {
      margin: 0;
      padding: 0;

      list-style: none;
    }

    .update-list li {
      margin: 3px 0;
    }

    .update-date {
      margin: 11px 0 0;
    }

    .contact {
      margin: 7px 0 0;

      font-weight: 700;
      color: #806b76;
    }

    /* =========================
       スマホ対応
    ========================= */

    @media (max-width: 600px) {
      .container {
        padding: 18px 12px 32px;
      }

      h1 {
        font-size: 25px;
        margin-bottom: 20px;
      }

      .section-title {
        font-size: 21px;
      }

      .info-box {
        padding: 16px;
        border-radius: 18px;
      }

      .info-title {
        font-size: 21px;
      }

      .product-name {
        font-size: 17px;
      }

      .quantity-button {
        min-width: 44px;
        height: 40px;
      }

      .quantity-input {
        width: 74px;
        height: 40px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =========================
         タイトル
    ========================= -->

    <h1>猫カフェ店舗用 🐈‍⬛ 計算ツール</h1>


    <!-- =========================
         食べ物
    ========================= -->

    <h2 class="section-title">
      <span class="emoji">🍰</span>
      <span>食べ物</span>
    </h2>

    <div id="foodList" class="product-list"></div>


    <!-- =========================
         飲み物
    ========================= -->

    <h2 class="section-title">
      <span class="emoji">☕</span>
      <span>飲み物</span>
    </h2>

    <div id="drinkList" class="product-list"></div>


    <!-- =========================
         注文内容・合計・材料
    ========================= -->

    <div class="info-box">

      <!-- 注文内容 -->

      <h2 class="info-title">
        <span class="emoji">🧾</span>
        <span>注文内容</span>
      </h2>

      <div id="orderList">
        <div class="empty-message">
          注文された商品がここに表示されます 🐾
        </div>
      </div>


      <!-- 合計 -->

      <div class="total-box">

        <div class="total-row">
          <span class="total-label">📦 合計個数</span>
          <span class="total-value">
            <span id="totalCount">0</span>個
          </span>
        </div>

        <div class="total-row">
          <span class="total-label">💰 合計金額</span>
          <span class="total-value">
            ¥<span id="totalPrice">0</span>
          </span>
        </div>

      </div>


      <!-- 必要な材料 -->

      <h2 class="info-title" style="margin-top: 25px;">
        <span class="emoji">🧺</span>
        <span>必要な材料</span>
      </h2>

      <div id="materialList" class="material-list">
        <div class="empty-message">
          商品を注文すると必要な材料が表示されます 🐾
        </div>
      </div>

    </div>


    <!-- =========================
         リセット
    ========================= -->

    <button id="resetButton" class="reset-button">
      🔄 注文をリセット
    </button>


    <!-- =========================
         アップデート情報
    ========================= -->

    <div class="update-info">

      <h3 class="update-title">
        📋 アップデート内容
      </h3>

      <ul class="update-list">
        <li>・注文内容が一覧で表示されるよう修正</li>
      </ul>

      <p class="update-date">
        📅 最終更新日：2026.09.30
      </p>

      <p class="contact">
        不具合・修正要望は恋すみれまで 💜
      </p>

    </div>

  </div>


  <script>

    /* =========================
       商品データ
    ========================= */

    const PRICE = 40000;

    const products = [
      {
        name: "いちごパンケーキ",
        category: "food",
        materials: {
          "小麦粉": 1,
          "ミルク": 1,
          "いちご": 1
        }
      },

      {
        name: "チョコバナナパンケーキ",
        category: "food",
        materials: {
          "小麦粉": 1,
          "バナナ": 1,
          "チョコレート": 1
        }
      },

      {
        name: "いちごショートケーキ",
        category: "food",
        materials: {
          "小麦粉": 1,
          "ミルク": 1,
          "いちご": 1
        }
      },

      {
        name: "濃厚ガトーショコラ",
        category: "food",
        materials: {
          "小麦粉": 1,
          "ミルク": 1,
          "チョコレート": 1
        }
      },

      {
        name: "カフェラテ",
        category: "drink",
        materials: {
          "ミルク": 1,
          "コーヒー豆": 1
        }
      },

      {
        name: "キャラメルラテ",
        category: "drink",
        materials: {
          "ミルク": 1,
          "コーヒー豆": 1,
          "キャラメル": 1
        }
      },

      {
        name: "いちごラテ",
        category: "drink",
        materials: {
          "ミルク": 1,
          "いちご": 1
        }
      },

      {
        name: "抹茶ラテ",
        category: "drink",
        materials: {
          "ミルク": 1,
          "抹茶": 1
        }
      }
    ];


    /* =========================
       個数
    ========================= */

    const quantities = products.map(() => 0);


    /* =========================
       商品カードを作る
    ========================= */

    function createProductCard(product, index) {

      const card = document.createElement("div");
      card.className = "product-card";

      const name = document.createElement("div");
      name.className = "product-name";
      name.textContent = product.name;

      const price = document.createElement("div");
      price.className = "product-price";
      price.textContent = "¥40,000 / 個";

      const quantityRow = document.createElement("div");
      quantityRow.className = "quantity-row";


      /* -10 */

      const minus10 = document.createElement("button");
      minus10.className = "quantity-button";
      minus10.textContent = "−10";

      minus10.addEventListener("click", () => {
        quantities[index] = Math.max(0, quantities[index] - 10);
        updateScreen();
      });


      /* -1 */

      const minus1 = document.createElement("button");
      minus1.className = "quantity-button";
      minus1.textContent = "−1";

      minus1.addEventListener("click", () => {
        quantities[index] = Math.max(0, quantities[index] - 1);
        updateScreen();
      });


      /* 数量入力 */

      const input = document.createElement("input");

      input.className = "quantity-input";
      input.type = "number";
      input.min = "0";
      input.step = "1";
      input.value = "0";

      input.addEventListener("input", () => {

        let value = parseInt(input.value, 10);

        if (isNaN(value) || value < 0) {
          value = 0;
        }

        quantities[index] = value;

        updateScreen();
      });


      /* +1 */

      const plus1 = document.createElement("button");
      plus1.className = "quantity-button";
      plus1.textContent = "+1";

      plus1.addEventListener("click", () => {
        quantities[index] += 1;
        updateScreen();
      });


      /* +10 */

      const plus10 = document.createElement("button");
      plus10.className = "quantity-button";
      plus10.textContent = "+10";

      plus10.addEventListener("click", () => {
        quantities[index] += 10;
        updateScreen();
      });


      quantityRow.appendChild(minus10);
      quantityRow.appendChild(minus1);
      quantityRow.appendChild(input);
      quantityRow.appendChild(plus1);
      quantityRow.appendChild(plus10);

      card.appendChild(name);
      card.appendChild(price);
      card.appendChild(quantityRow);

      return card;
    }


    /* =========================
       商品を画面に表示
    ========================= */

    function renderProducts() {

      const foodList = document.getElementById("foodList");
      const drinkList = document.getElementById("drinkList");

      foodList.innerHTML = "";
      drinkList.innerHTML = "";

      products.forEach((product, index) => {

        const card = createProductCard(product, index);

        if (product.category === "food") {
          foodList.appendChild(card);
        } else {
          drinkList.appendChild(card);
        }

      });
    }


    /* =========================
       画面更新
    ========================= */

    function updateScreen() {

      let totalCount = 0;
      let totalPrice = 0;

      const materials = {};


      /* 合計を計算 */

      products.forEach((product, index) => {

        const quantity = quantities[index];

        totalCount += quantity;
        totalPrice += quantity * PRICE;


        /* 材料を合計 */

        Object.entries(product.materials).forEach(
          ([materialName, amount]) => {

            if (!materials[materialName]) {
              materials[materialName] = 0;
            }

            materials[materialName] += amount * quantity;

          }
        );

      });


      /* 合計表示 */

      document.getElementById("totalCount").textContent =
        totalCount.toLocaleString();

      document.getElementById("totalPrice").textContent =
        totalPrice.toLocaleString();


      /* =========================
         商品カードの入力欄を更新
      ========================= */

      const inputs =
        document.querySelectorAll(".quantity-input");

      inputs.forEach((input, index) => {
        input.value = quantities[index];
      });


      /* =========================
         注文内容
      ========================= */

      const orderList =
        document.getElementById("orderList");

      orderList.innerHTML = "";

      const orderedProducts = products.filter(
        (_, index) => quantities[index] > 0
      );


      if (orderedProducts.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-message";

        empty.textContent =
          "注文された商品がここに表示されます 🐾";

        orderList.appendChild(empty);

      } else {

        orderedProducts.forEach(product => {

          const index =
            products.indexOf(product);

          const item =
            document.createElement("div");

          item.className = "order-item";


          const name =
            document.createElement("span");

          name.className = "order-item-name";

          name.textContent =
            "🍰 " + product.name;


          const quantity =
            document.createElement("span");

          quantity.className =
            "order-item-quantity";

          quantity.textContent =
            "× " + quantities[index] + "個";


          item.appendChild(name);
          item.appendChild(quantity);

          orderList.appendChild(item);

        });

      }


      /* =========================
         必要な材料
      ========================= */

      const materialList =
        document.getElementById("materialList");

      materialList.innerHTML = "";


      if (totalCount === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-message";

        empty.textContent =
          "商品を注文すると必要な材料が表示されます 🐾";

        materialList.appendChild(empty);

      } else {

        Object.entries(materials).forEach(
          ([materialName, amount]) => {

            if (amount <= 0) {
              return;
            }

            const item =
              document.createElement("div");

            item.className =
              "material-item";


            const name =
              document.createElement("span");

            name.className =
              "material-name";

            name.textContent =
              "・" + materialName;


            const quantity =
              document.createElement("span");

            quantity.className =
              "material-quantity";

            quantity.textContent =
              amount + "個";


            item.appendChild(name);
            item.appendChild(quantity);

            materialList.appendChild(item);

          }
        );

      }

    }


    /* =========================
       リセット
    ========================= */

    document
      .getElementById("resetButton")
      .addEventListener("click", () => {

        quantities.fill(0);

        updateScreen();

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });

      });


    /* =========================
       初期表示
    ========================= */

    renderProducts();
    updateScreen();

  </script>

</body>
</html>
