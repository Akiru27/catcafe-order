<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カフェ注文管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fffaf7;
      color: #4a403d;
    }

    .container {
      max-width: 700px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
    }

    h2 {
      margin: 28px 0 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #eaded8;
    }
    .update-info {
  margin-top: 30px;
  padding: 15px;
  font-size: 12px;
  color: #8a7b76;
  text-align: center;
  border-top: 1px solid #eadfd9;
}

.update-info h3 {
  margin: 0 0 8px;
  font-size: 13px;
  color: #6f625d;
}

.update-info ul {
  margin: 0 0 10px;
  padding-left: 0;
  list-style: none;
}

.update-info p {
  margin: 5px 0;
}

    /* 合計金額 */
    .summary {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .total-price {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
    }

    .total-count {
      text-align: center;
      color: #888;
      margin-top: 5px;
    }

    /* 商品 */
    .product {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .product-name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .price {
      font-size: 13px;
      color: #888;
      margin-bottom: 10px;
    }

    /* ボタンと個数 */
    .controls {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid #d8ccc7;
      background: #fff;
      color: #4a403d;
      border-radius: 9px;
      padding: 10px 12px;
      min-height: 44px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #f8f0ec;
    }

    .quantity {
      width: 70px;
      height: 44px;
      text-align: center;
      border: 1px solid #d8ccc7;
      border-radius: 9px;
      font-size: 18px;
      font-weight: bold;
      background: #fff;
    }

    /* 注文内容・材料 */
    .info-box {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-top: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .info-box h2 {
      margin-top: 0;
    }

    .info-box h2:not(:first-child) {
      margin-top: 28px;
    }

    .list-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 11px 2px;
      border-bottom: 1px solid #eee;
    }

    .list-row:last-child {
      border-bottom: none;
    }

    .list-name {
      font-weight: 500;
    }

    .list-quantity {
      font-weight: bold;
      white-space: nowrap;
    }

    .empty {
      color: #999;
      text-align: center;
      padding: 12px 5px;
    }

    /* リセット */
    .reset {
      width: 100%;
      margin-top: 25px;
      background: #f5e5df;
      border: none;
      font-weight: bold;
      font-size: 16px;
    }

    .reset:hover {
      background: #ecd8d0;
    }

    /* スマホ用 */
    @media (max-width: 500px) {

      body {
        padding: 12px;
      }

      .controls {
        gap: 4px;
      }

      .controls button {
        padding: 9px 10px;
        font-size: 14px;
      }

      .quantity {
        width: 62px;
      }

      .total-price {
        font-size: 28px;
      }

    }

  </style>
</head>


<body>

<div class="container">

 <h1>猫カフェ店舗用 🐈‍⬛ 計算ツール</h1>


  <!-- =========================
       合計
  ========================== -->

  <div class="summary">

    <div class="total-price" id="totalPrice">
      ¥0
    </div>

    <div class="total-count" id="totalCount">
      注文 0個
    </div>

  </div>


  <!-- =========================
       食べ物
  ========================== -->

  <h2>🍰 食べ物</h2>

  <div id="foodList"></div>


  <!-- =========================
       飲み物
  ========================== -->

  <h2>🥤 飲み物</h2>

  <div id="drinkList"></div>


  <!-- =========================
       注文内容・材料
  ========================== -->
<div class="info-box">

  <h2>注文内容</h2>
  <div id="orderList">
    まだ注文はありません
  </div>

  <div class="summary">
    <div>合計個数：<span id="totalCount">0</span>個</div>
    <div>合計金額：<span id="totalPrice">0</span>円</div>
  </div>

  <h2>必要な材料</h2>
  <div id="materialList">
    まだ注文はありません
  </div>

</div>

  </div>


  <!-- =========================
       リセット
  ========================== -->

  <button
    class="reset"
    id="resetButton"
    type="button"
  >
    🗑 注文をリセット
  </button>


</div>


<script>

  /* =========================================
     商品データ
  ========================================= */

  const PRICE = 40000;


  const products = [

    /* 食べ物 */

    {
      name: "いちごパンケーキ",
      category: "food",
      materials: {
        "小麦粉": 1,
        "ミルク": 1,
        "いちご": 1
      }
    },

    {
      name: "チョコバナナパンケーキ",
      category: "food",
      materials: {
        "小麦粉": 1,
        "バナナ": 1,
        "チョコレート": 1
      }
    },

    {
      name: "いちごショートケーキ",
      category: "food",
      materials: {
        "小麦粉": 1,
        "ミルク": 1,
        "いちご": 1
      }
    },

    {
      name: "濃厚ガトーショコラ",
      category: "food",
      materials: {
        "小麦粉": 1,
        "ミルク": 1,
        "チョコレート": 1
      }
    },


    /* 飲み物 */

    {
      name: "カフェラテ",
      category: "drink",
      materials: {
        "ミルク": 1,
        "コーヒー豆": 1
      }
    },

    {
      name: "キャラメルラテ",
      category: "drink",
      materials: {
        "ミルク": 1,
        "コーヒー豆": 1,
        "キャラメル": 1
      }
    },

    {
      name: "いちごラテ",
      category: "drink",
      materials: {
        "ミルク": 1,
        "いちご": 1
      }
    },

    {
      name: "抹茶ラテ",
      category: "drink",
      materials: {
        "ミルク": 1,
        "抹茶": 1
      }
    }

  ];


  /* =========================================
     注文個数
  ========================================= */

  const quantities = products.map(() => 0);


  /* =========================================
     商品を作る
  ========================================= */

  function createProduct(product, index) {

    const div = document.createElement("div");

    div.className = "product";


    div.innerHTML = `

      <div class="product-name">
        ${product.name}
      </div>

      <div class="price">
        ¥${PRICE.toLocaleString()} / 個
      </div>

      <div class="controls">

        <button
          type="button"
          data-action="minus10"
        >
          −10
        </button>

        <button
          type="button"
          data-action="minus1"
        >
          −1
        </button>

        <input
          class="quantity"
          type="number"
          min="0"
          step="1"
          value="0"
          inputmode="numeric"
          aria-label="${product.name}の個数"
        >

        <button
          type="button"
          data-action="plus1"
        >
          ＋1
        </button>

        <button
          type="button"
          data-action="plus10"
        >
          ＋10
        </button>

      </div>
    `;


    const input =
      div.querySelector(".quantity");


    /* −10 */

    div
      .querySelector('[data-action="minus10"]')
      .addEventListener("click", function() {

        changeQuantity(index, -10);

      });


    /* −1 */

    div
      .querySelector('[data-action="minus1"]')
      .addEventListener("click", function() {

        changeQuantity(index, -1);

      });


    /* ＋1 */

    div
      .querySelector('[data-action="plus1"]')
      .addEventListener("click", function() {

        changeQuantity(index, 1);

      });


    /* ＋10 */

    div
      .querySelector('[data-action="plus10"]')
      .addEventListener("click", function() {

        changeQuantity(index, 10);

      });


    /* 数字を直接入力 */

    input.addEventListener("change", function() {

      let value = parseInt(input.value, 10);


      if (isNaN(value) || value < 0) {

        value = 0;

      }


      quantities[index] = value;

      updateScreen();

    });


    return div;

  }


  /* =========================================
     商品を表示
  ========================================= */

  const foodList =
    document.getElementById("foodList");


  const drinkList =
    document.getElementById("drinkList");


  products.forEach(function(product, index) {

    const element =
      createProduct(product, index);


    if (product.category === "food") {

      foodList.appendChild(element);

    } else {

      drinkList.appendChild(element);

    }

  });


  /* =========================================
     個数を変更
  ========================================= */

  function changeQuantity(index, amount) {

    quantities[index] += amount;


    if (quantities[index] < 0) {

      quantities[index] = 0;

    }


    updateScreen();

  }


  /* =========================================
     画面更新
  ========================================= */

  function updateScreen() {

    let totalCount = 0;

    let totalPrice = 0;


    /* 材料の合計 */

    const materials = {};


    /* 商品を計算 */

    products.forEach(function(product, index) {

      const quantity =
        quantities[index];


      /* 個数 */

      totalCount += quantity;


      /* 金額 */

      totalPrice +=
        quantity * PRICE;


      /* 材料 */

      Object.entries(product.materials)
        .forEach(function([material, amount]) {

          if (!materials[material]) {

            materials[material] = 0;

          }


          materials[material] +=
            amount * quantity;

        });

    });


    /* =========================================
       合計金額
    ========================================= */

    document.getElementById("totalPrice")
      .textContent =
      "¥" + totalPrice.toLocaleString();


    /* =========================================
       合計個数
    ========================================= */

    document.getElementById("totalCount")
      .textContent =
      "注文 " + totalCount + "個";


    /* =========================================
       商品の入力欄を更新
    ========================================= */

    quantities.forEach(function(quantity, index) {

      const input =
        document.getElementById(
          "quantity-" + index
        );


      /*
        入力欄は商品を作ったときに
        IDを付けていないため、
        下で商品リストから取得する
      */

    });


    /* =========================================
       すべての入力欄を更新
    ========================================= */

    const inputs =
      document.querySelectorAll(".quantity");


    inputs.forEach(function(input, index) {

      input.value =
        quantities[index];

    });


    /* =========================================
       注文内容
    ========================================= */

    const orderList =
      document.getElementById("orderList");


    orderList.innerHTML = "";


    let hasOrders = false;


    products.forEach(function(product, index) {

      const quantity =
        quantities[index];


      /* 0個の商品は表示しない */

      if (quantity <= 0) {

        return;

      }


      hasOrders = true;


      const row =
        document.createElement("div");


      row.className = "list-row";


      row.innerHTML = `

        <span class="list-name">
          ${product.name}
        </span>

        <span class="list-quantity">
          × ${quantity}
        </span>

      `;


      orderList.appendChild(row);

    });


    /* 注文がない場合 */

    if (!hasOrders) {

      orderList.innerHTML = `

        <div class="empty">
          注文された商品がここに表示されます。
        </div>

      `;

    }


    /* =========================================
       必要な材料
    ========================================= */

    const materialList =
      document.getElementById("materialList");


    materialList.innerHTML = "";


    const materialNames =
      Object.keys(materials)
        .filter(function(material) {

          return materials[material] > 0;

        });


    /* 材料がない場合 */

    if (materialNames.length === 0) {

      materialList.innerHTML = `

        <div class="empty">
          商品を注文すると必要な材料が表示されます。
        </div>

      `;

      return;

    }


    /* 材料を表示 */

    materialNames.forEach(function(material) {

      const row =
        document.createElement("div");


      row.className = "list-row";


      row.innerHTML = `

        <span class="list-name">
          ${material}
        </span>

        <span class="list-quantity">
          ${materials[material]}個
        </span>

      `;


      materialList.appendChild(row);

    });

  }


  /* =========================================
     リセット
  ========================================= */

  document
    .getElementById("resetButton")
    .addEventListener("click", function() {


      /* 確認 */

      const result =
        confirm(
          "注文内容をすべてリセットしますか？"
        );


      if (!result) {

        return;

      }


      /* すべて0にする */

      quantities.fill(0);


      /* 画面更新 */

      updateScreen();

    });


  /* =========================================
     最初の画面
  ========================================= */

  updateScreen();

</script>
<div class="update-info">
  <h3>アップデート内容</h3>
  <ul>
    <li>注文内容が一覧で表示されるよう修正</li>
  </ul>

  <p>最終更新日：2026.09.30</p>

  <p>不具合・修正要望は恋すみれまで 💜</p>
</div>
</body>
</html>
